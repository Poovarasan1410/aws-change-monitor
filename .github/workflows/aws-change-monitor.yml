name: AWS Change Monitor

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aws-change-monitor
  cancel-in-progress: false

jobs:

  monitor:

    name: Monitor AWS Changes

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify configuration
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=========================================="
          echo "AWS CHANGE MONITOR"
          echo "=========================================="

          python --version

          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            echo "Teams webhook: CONFIGURED"
          else
            echo "ERROR: Teams webhook not configured"
            exit 1
          fi

          if [ -n "$GH_TOKEN" ]; then
            echo "GitHub token: CONFIGURED"
          else
            echo "ERROR: GitHub token not configured"
            exit 1
          fi

      - name: Run AWS change monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python -u scripts/monitor.py

      - name: Run AWS documentation monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python -u scripts/docs_monitor.py

      - name: Run AWS API model monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python -u scripts/api_models.py

      - name: Show monitoring state
        if: always()
        run: |
          echo "=========================================="
          echo "MONITORING STATE"
          echo "=========================================="

          if [ -f data/state.json ]; then
            echo "AWS state.json:"
            cat data/state.json
          fi

          if [ -f data/api_state.json ]; then
            echo "API api_state.json:"
            cat data/api_state.json
          fi

      - name: Save monitoring state
        if: always()
        run: |
          git config user.name "AWS Change Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f data/state.json ]; then
            git add data/state.json
          fi

          if [ -f data/api_state.json ]; then
            git add data/api_state.json
          fi

          if git diff --cached --quiet; then
            echo "No monitoring state changes."
          else
            git commit -m "chore: update AWS monitoring state"
            git push
          fi

      - name: Workflow summary
        if: always()
        run: |
          echo "=========================================="
          echo "AWS CHANGE MONITOR COMPLETED"
          echo "=========================================="
