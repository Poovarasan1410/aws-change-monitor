name: Teams Webhook Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teams-test:
    runs-on: ubuntu-latest

    steps:

      - name: Test Microsoft Teams webhook
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request

          webhook = os.environ["TEAMS_WEBHOOK_URL"]

          payload = {
              "type": "message",
              "attachments": [
                  {
                      "contentType": "application/vnd.microsoft.card.adaptive",
                      "contentUrl": None,
                      "content": {
                          "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          "type": "AdaptiveCard",
                          "version": "1.2",

                          "body": [
                              {
                                  "type": "TextBlock",
                                  "text": "🚨 AWS MONITOR TEST",
                                  "weight": "Bolder",
                                  "size": "Large",
                                  "wrap": True
                              },
                              {
                                  "type": "TextBlock",
                                  "text": "GitHub Actions → Microsoft Teams webhook is working.",
                                  "wrap": True
                              },
                              {
                                  "type": "FactSet",
                                  "facts": [
                                      {
                                          "title": "Service",
                                          "value": "EC2"
                                      },
                                      {
                                          "title": "Priority",
                                          "value": "HIGH"
                                      },
                                      {
                                          "title": "Test",
                                          "value": "AWS Change Monitor"
                                      }
                                  ]
                              }
                          ]
                      }
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print("HTTP STATUS:", response.status)

                  body = response.read().decode()

                  print("RESPONSE:", body)

          except Exception as error:

              print("TEAMS WEBHOOK ERROR:", error)

              raise

          PY
