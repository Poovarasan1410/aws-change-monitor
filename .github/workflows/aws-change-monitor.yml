name: AWS Change Monitor

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aws-change-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Monitor AWS Changes
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AWS change monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/monitor.py

      - name: Run AWS API model monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/api_models.py

      - name: Save monitoring state
        run: |
          git config user.name "AWS Change Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state.json
          git add data/api_state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: update AWS change state"
            git push
          fi
